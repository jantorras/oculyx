name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build OculyxSetup.exe
        shell: powershell
        run: .\scripts\build-windows-app.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: server/assets/OculyxSetup.exe

  release:
    needs: windows-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: server/assets
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: bash scripts/package.sh
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" oculyx.tar.gz oculyx.tar.gz.sha256 \
            --title "Oculyx $GITHUB_REF_NAME" --generate-notes
